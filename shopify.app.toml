# Canonical Shopify configuration for Multi Sync Google Feed.
# Local development updates only the selected dev-store preview to the CLI tunnel;
# deployments continue to use the production application_url below.

client_id = "cd9cc67d2db7611a483d8e33b30328f2"
name = "Multi Sync Google Feed"
handle = "multi-sync-google-feed"
application_url = "https://multi-sync.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "adon-test.myshopify.com"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "write_products,read_products,read_inventory,read_locations,read_locales,read_markets,write_markets,read_translations"

[auth]
redirect_urls = ["https://multi-sync.fly.dev/auth/callback"]

[pos]
embedded = false

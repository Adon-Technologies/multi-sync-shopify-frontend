# fly.toml app configuration file generated for multi-sync on 2026-07-27T10:59:06+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'multi-sync'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SHOPIFY_APP_URL = "https://multi-sync.fly.dev"
  MULTI_SYNC_BACKEND_URL = "https://multi-sync-server-392904571480.europe-west1.run.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

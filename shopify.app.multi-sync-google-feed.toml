# Production cutover configuration for the existing Multi Sync Google Feed app.
# Keep this separate from shopify.app.toml until the cutover has passed every
# local readiness check. Nothing in this file is applied to Shopify until an
# explicit `shopify app deploy --config multi-sync-google-feed` command.

client_id = "cd9cc67d2db7611a483d8e33b30328f2"
name = "Multi Sync Google Feed"
handle = "multi-sync-google-feed"
application_url = "https://multi-sync.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Preserve the scopes already requested by the existing app. The current code
# reads products, inventory, locations, locales, markets, and translations,
# and writes product metafields used by the attribute-rule feature.
scopes = "write_products,read_products,read_inventory,read_locations,read_locales,read_markets,write_markets,read_translations"

[auth]
redirect_urls = ["https://multi-sync.fly.dev/auth/callback"]

[pos]
embedded = false
